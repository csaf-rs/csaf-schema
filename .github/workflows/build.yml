name: build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update rustup
        run: rustup update stable --no-self-update
      - name: Run shared format, clippy and doc checks
        uses: csaf-rs/shared-workflows/.github/actions/rust-checks@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0
        with:
          doc-extra-args: "--all-features"
      - name: Prepare targets
        run: |
          rustup target add x86_64-unknown-linux-gnu
      - name: Run tests
        run: cargo test --locked --all-targets --workspace --verbose
      - name: Build native crates
        run: cargo build --locked --workspace --verbose
      - name: Build without default features
        run: cargo build --workspace --no-default-features --verbose
      - name: Publish dry-run
        uses: csaf-rs/shared-workflows/.github/actions/cargo-publish-dry-run@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0

  coverage:
    uses: csaf-rs/shared-workflows/.github/workflows/rust-coverage.yml@c2f5f2066f1d96c12c1e33a8dea1fceb5eb37366 # v1.12.0
